<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#00083a;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;z-index:5}
.ov.show{display:flex}
#title{pointer-events:none;justify-content:flex-start;padding-top:12%}
#title button{pointer-events:auto}
#end{background:rgba(0,6,40,.7)}
h1{font-size:64px;margin:0;font-style:italic;letter-spacing:-2px;text-shadow:4px 4px 0 #0a3fbf;line-height:1}
h2{font-size:34px;margin:2px 0;font-style:italic;color:#ffd24a;text-shadow:3px 3px 0 #0a3fbf}
.sub{font-weight:800;color:#ffd24a;font-size:14px}
button{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:16px;padding:13px 28px;margin:8px 4px 0;background:#1752d6;color:#fff;box-shadow:0 5px 0 #0a2f8a}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #0a2f8a}
.alt{background:#2c2f4a!important;box-shadow:0 5px 0 #14162b!important;font-size:15px!important;padding:10px 16px!important}
.gold{background:#e2a90f!important;box-shadow:0 5px 0 #8a6606!important;color:#1a1200!important}
.big{font-size:54px;font-weight:900;margin:2px 0}.stat{font-size:16px;font-weight:700;margin:3px 0}
.tagrow{display:flex;gap:6px;margin:10px 0 0}
.tagrow input{font:inherit;font-size:14px;width:128px;padding:8px;border-radius:10px;border:2px solid #1752d6;background:#02104f;color:#fff;text-align:center;user-select:text;-webkit-user-select:text}
#mute{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:6;margin:0;padding:6px 12px;font-size:16px;border-radius:12px}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:#ffd24a;color:#000;font-weight:800;padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
</style></head><body>

let ac=null;
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f,d,type,v,slide,delay){if(!ac||save.mute)return;try{const n=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(slide,20),n+d);g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
const PENTA=[0,2,4,7,9],note=k=>261.63*Math.pow(2,(12*Math.floor(k/5)+PENTA[k%5])/12);
const sfx={
 flap(){tone(330+Math.random()*50,.1,'sine',.09,720)},
 score(){const f=note((score%15)+5);tone(f,.22,'triangle',.11);tone(f*2,.16,'sine',.05,0,.03)},
 hit(){tone(200,.25,'triangle',.14,45);tone(120,.3,'sine',.12,40,.05)},
 medal(){[0,4,7,12,16].forEach((k,i)=>{const f=392*Math.pow(2,k/12);tone(f,.3,'triangle',.1,0,i*.09);tone(f*2,.2,'sine',.04,0,i*.09)})}};

/* music */
let nb=null;
function noise(d,delay,v,hp){if(!ac)return;try{if(!nb){nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const n=ac.currentTime+delay,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(n);s.stop(n+d+.02)}catch(e){}}
const ROOT=[110,87.31,130.81,98],CH=[[440,523.25,659.25],[349.23,440,523.25],[523.25,659.25,783.99],[392,493.88,587.33]];
const mus={on:false,next:0,step:0};
const bpm=()=>112+Math.min(score,40)*1.4;
function playStep(s,d){
 const bar=Math.floor(s/16)%4,k=s%16;
 if(k%4===0){tone(150,.16,'sine',.2,42,d)}
 if(k===4||k===12){noise(.12,d,.09,1500)}
 if(k%2===1){noise(.04,d,.05,7000)}
 if([0,3,6,8,11,14].includes(k)){const f=ROOT[bar]*(k===8||k===14?2:1);tone(f,.2,'triangle',.16,0,d)}
 if(k%2===0){const c=CH[bar];tone(c[(k/2)%3]*(k>=8?2:1),.14,'triangle',.05,0,d);}
}
function sched(){if(!ac||!mus.on||save.mute)return;while(mus.next<ac.currentTime+.15){playStep(mus.step,Math.max(0,mus.next-ac.currentTime));mus.next+=60/bpm()/4;mus.step++}}
function startMusic(){if(!ac)return;mus.on=true;mus.next=ac.currentTime+.05;mus.step=0}
function stopMusic(){mus.on=false}
/* sprite */
let sprite=null;
{const img=new Image();img.onload=()=>{const N=192,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.drawImage(img,0,0,N,N);
 const p=x.getImageData(0,0,N,N).data;let x0=N,y0=N,x1=0,y1=0;
 for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++)if(p[(y*N+xx)*4+3]>20){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}
 const w=x1-x0+1,h=y1-y0+1,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);sprite={c:o,a:w/h}};img.src=CAT}

/* game */
let t50=0,cx=0,state='title',y,vy,rot,pipes,score,parts,floats,t=0,shake=0,flash=0,scroll=0,deadT=0,newBest=false,lastGapY;
const medalFor=s=>s>=50?'🥇':s>=25?'🥈':s>=10?'🥉':'';
const gapFor=s=>Math.max(122,160-s*.9);
const speedFor=s=>Math.min(175,118+s*1.6);
function reset(){t50=0;y=VH*.42;vy=0;rot=0;pipes=[];score=0;parts=[];floats=[];shake=0;flash=0;deadT=0;newBest=false;lastGapY=VH*.4}
function spawn(){
 const last=pipes[pipes.length-1],x=last?last.x+195:VW+90,g=gapFor(score);
 const lo=70+g/2,hi=GY-55-g/2;let c=lastGapY+(Math.random()*2-1)*150;c=Math.max(lo,Math.min(hi,c));lastGapY=c;
 pipes.push({x,c,c0:c,ph:Math.random()*6.28,sp:1.5+Math.random()*.9,g,passed:false,up:Math.random()<.5,id:(last?last.id:0)+1});
}
function flap(){
 if(state==='title'||state==='ready'){if(state==='title')return;state='play'}
 if(state!=='play')return;
 vy=FLAP;sfx.flap();if(!mus.on)startMusic();
 for(let i=0;i<6;i++)parts.push({x:CX-6,y:y+6,vx:-40-Math.random()*60,vy:30+Math.random()*60,l:.6,c:'#3b8cff',s:3});
}
function die(){
 if(state!=='play')return;state='dead';stopMusic();sfx.hit();shake=12;flash=.7;vy=Math.min(vy,-200);
 for(let i=0;i<24;i++)parts.push({x:CX,y:y,vx:(Math.random()-.5)*260,vy:(Math.random()-.8)*260,l:.9,c:i%2?'#ffd24a':'#fff',s:3+Math.random()*3});
 if(score>save.best){save.best=score;newBest=true}persist();
}
function step(dt){
 t+=dt;sched();
 const sp=state==='dead'?0:speedFor(score);
 if(state!=='dead'){scroll=(scroll+sp*dt)%48;cx+=sp*dt*.3}
 if(state==='ready'||state==='title'){y=VH*.42+Math.sin(t*4)*8;rot=0}
 else{
  vy=Math.min(vy+GRAV*dt,720);y+=vy*dt;rot=Math.max(-.45,Math.min(1.3,vy/520));
  if(y<R){y=R;if(vy<0)vy=0}
 }
 if(state==='play'||state==='dead'){
  if(state==='play'){
   while(!pipes.length||pipes[pipes.length-1].x<VW+60)spawn();
   for(const p of pipes){p.x-=sp*dt;
    if(score>=50){const r=Math.min(1,(t-t50)/1.5),am=Math.min(62,28+(score-50)*.7)*r;p.c=Math.max(70+p.g/2,Math.min(GY-55-p.g/2,p.c0+Math.sin(t*p.sp+p.ph)*am))}
    if(!p.passed&&p.x+PW<CX-R){p.passed=true;score++;sfx.score();floats.push({x:CX,y:y-30,txt:'+1',l:1});if(score===50){t50=t;floats.push({x:VW/2,y:VH*.3+46,txt:'CANDLES ARE MOVING',l:2.2})}
    if(score===10||score===25||score===50){sfx.medal();floats.push({x:VW/2,y:VH*.3,txt:medalFor(score),l:1.6,big:true})}}
    const e1=p.c-p.g/2,e2=p.c+p.g/2;if(CX+R-2>p.x&&CX-R+2<p.x+PW&&(y-R+2<e1-18||y+R-2>e2+18))die();if(CX+R-2>p.x+PW/2-3&&CX-R+2<p.x+PW/2+3&&(y-R+2<e1||y+R-2>e2))die();}
   pipes=pipes.filter(p=>p.x>-PW-10);
   if(y+R>=GY){y=GY-R;die()}
  }else if(y+R>=GY){y=GY-R;vy=0;deadT+=dt;if(deadT>.6&&!$('end').classList.contains('show'))showEnd()}
 }
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 for(const f of floats){f.y-=40*dt;f.l-=dt}floats=floats.filter(f=>f.l>0);
 shake*=.88;flash*=.88;
}
function showEnd(){
 $('eScore').textContent=score;$('eMedal').textContent=medalFor(score);
 {const c=$('eCat'),x=c.getContext('2d');x.clearRect(0,0,240,240);if(sprite){const h=220,w=Math.min(230,h*sprite.a),hh=w/sprite.a;x.drawImage(sprite.c,(240-w)/2,(240-hh)/2,w,hh)}}
 $('eBest').textContent=newBest?'NEW BEST!':'BEST '+save.best;
 
 $('end').classList.add('show');if(medalFor(score))sfx.medal();
}
function start(){$('title').classList.remove('show');$('end').classList.remove('show');reset();state='ready'}
$('play').onclick=e=>{initAudio();start()};
$('again').onclick=()=>{initAudio();start()};
$('mute').onclick=e=>{save.mute=!save.mute;persist();if(save.mute)stopMusic();$('mute').textContent=save.mute?'🔇':'🔊'};$('mute').textContent=save.mute?'🔇':'🔊';
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();flap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='ready'||state==='play')flap();}});

/* share */
const clean=s=>{s=(s||'').trim().replace(/\s+/g,'');return s?(s[0]==='@'?s:'@'+s):''};
function toast(s){const el=$('toast');el.textContent=s;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,2200)}
function card(cb){
 const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,1350);g.addColorStop(0,'#00083a');g.addColorStop(1,'#0b4fc4');x.fillStyle=g;x.fillRect(0,0,1080,1350);
 x.textAlign='center';x.fillStyle='#fff';x.font='italic 900 150px "Trebuchet MS",sans-serif';x.fillText('LMEOW',540,190);
 x.fillStyle='#ffd24a';x.font='900 52px "Trebuchet MS",sans-serif';x.fillText('FLAP',540,260);
 if(sprite){const h=480,w=h*sprite.a;x.drawImage(sprite.c,540-w/2,310,w,h)}
 x.fillStyle='#fff';x.font='900 200px "Trebuchet MS",sans-serif';x.fillText(String(score),540,1050);
 x.font='110px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.fillText(medalFor(score),540,1180);
 x.fillStyle='#fff';x.font='700 38px "Trebuchet MS",sans-serif';x.fillText('@lmeowfamily  $LMEOW',540,1290);
 c.toBlob(cb,'image/png');
}
$('share').onclick=()=>{
 const txt='LMEOW FLAP 😹 '+score+' '+medalFor(score)+"\nETH needs a meme. It's the cat.\n@lmeowfamily $LMEOW";
 card(blob=>{try{if(blob){const f=new File([blob],'lmeow-flap.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:txt}).catch(()=>{});return}}}catch(e){}
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('copied. go post it.'));else toast('screenshot it and post it')});
};

/* draw */
const hash=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
function candle(p,top){
 const col=p.up?['#16c784','#8ff5c8','#0b7a52']:['#ea3943','#ff9aa0','#9a1f27'];
 const e1=p.c-p.g/2,e2=p.c+p.g/2,cx=p.x+PW/2;let b0,b1,w0,w1;
 if(top){b0=-10;b1=e1-18;w0=-10;w1=e1}else{b0=e2+18;b1=GY;w0=e2;w1=GY}
 ctx.fillStyle=col[2];ctx.fillRect(cx-2,w0,4,w1-w0);
 ctx.fillStyle=col[0];ctx.fillRect(p.x,b0,PW,b1-b0);ctx.fillStyle=col[1];ctx.fillRect(p.x+5,b0,7,b1-b0);
 ctx.strokeStyle=col[2];ctx.lineWidth=2;ctx.strokeRect(p.x+1,b0,PW-2,b1-b0);
}
function draw(){
 ctx.setTransform(DPR*S,0,0,DPR*S,0,0);ctx.save();
 if(shake>.4)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 const sk=ctx.createLinearGradient(0,0,0,GY);sk.addColorStop(0,'#00083a');sk.addColorStop(1,'#0a3d96');ctx.fillStyle=sk;ctx.fillRect(-20,-20,VW+40,VH+40);
 ctx.fillStyle='#fff';for(let i=0;i<45;i++){ctx.globalAlpha=.3+.6*Math.abs(Math.sin(t*1.2+i));ctx.fillRect(hash(i)*VW,hash(i+50)*GY*.6,1.5,1.5)}ctx.globalAlpha=1;
 // chart grid
 ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
 for(let gy=GY%50;gy<GY;gy+=50){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(VW,gy);ctx.stroke()}
 for(let gx=-(cx%60);gx<VW;gx+=60){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,GY);ctx.stroke()}
 // ethereum logo
 {ctx.save();ctx.translate(VW/2,GY*.36+Math.sin(t*.8)*6);const k=95;
  const poly=(pts,a)=>{ctx.fillStyle='rgba(140,190,255,'+a+')';ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0]*k,q[1]*k):ctx.moveTo(q[0]*k,q[1]*k));ctx.closePath();ctx.fill()};
  poly([[0,-1],[-.62,.08],[0,-.18]],.16);poly([[0,-1],[.62,.08],[0,-.18]],.1);
  poly([[-.62,.08],[0,.3],[0,-.18]],.12);poly([[.62,.08],[0,.3],[0,-.18]],.18);
  poly([[-.62,.22],[0,1],[0,.46]],.14);poly([[.62,.22],[0,1],[0,.46]],.1);ctx.restore()}
 // price chart line
 {const st=28,k0=Math.floor(cx/st),pts=[];
  for(let i=-1;i<=Math.ceil(VW/st)+1;i++){const k=k0+i;pts.push([i*st-(cx%st),GY*.66+(hash(k*3)-.5)*80+Math.sin(k*.22)*28])}
  ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
  ctx.lineTo(pts[pts.length-1][0],GY);ctx.lineTo(pts[0][0],GY);ctx.closePath();
  const fg=ctx.createLinearGradient(0,GY*.4,0,GY);fg.addColorStop(0,'rgba(22,199,132,.16)');fg.addColorStop(1,'rgba(22,199,132,0)');ctx.fillStyle=fg;ctx.fill();
  ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.strokeStyle='rgba(22,199,132,.45)';ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke()}
 // pipes
 for(const p of pipes){candle(p,true);candle(p,false)}
 // ground
 ctx.fillStyle='#0c2f7a';ctx.fillRect(-10,GY,VW+20,GH+10);ctx.fillStyle='#2a78ff';ctx.fillRect(-10,GY,VW+20,6);
 ctx.fillStyle='rgba(255,255,255,.12)';for(let i=-1;i<9;i++)ctx.fillRect(i*48-scroll,GY+6,24,6);
 // crowd silhouettes
 ctx.fillStyle='#02051a';for(let i=-1;i<13;i++){const bx=i*30+(i%2?4:0)-scroll*.6%30,hh=8+hash(i+7)*8;ctx.beginPath();ctx.arc(bx,GY+26-hh,9,0,6.3);ctx.fill();ctx.fillRect(bx-11,GY+28-hh,22,hh+30)}
 // particles
 for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.l*2));ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}ctx.globalAlpha=1;
 // cat
 if(state!=='title'||true){ctx.save();ctx.translate(CX,y);ctx.rotate(rot);const h=46;
  if(sprite){const w=h*sprite.a;ctx.drawImage(sprite.c,-w/2,-h/2,w,h)}else{ctx.font='40px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('😹',0,0)}ctx.restore()}
 // score
 if(state==='play'||state==='dead'){ctx.font='900 54px "Trebuchet MS"';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#00083a';ctx.strokeText(score,VW/2,96);ctx.fillStyle='#fff';ctx.fillText(score,VW/2,96)}
 if(state==='ready'){ctx.font='900 20px "Trebuchet MS"';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#00083a';ctx.strokeText('TAP TO FLAP',VW/2,y+70);ctx.fillStyle='#ffd24a';ctx.fillText('TAP TO FLAP',VW/2,y+70)}
 for(const f of floats){ctx.globalAlpha=Math.max(0,Math.min(1,f.l));ctx.font=(f.big?'60px':'900 22px')+' "Trebuchet MS"';ctx.textAlign='center';ctx.fillStyle='#ffd24a';ctx.fillText(f.txt,f.x,f.y)}ctx.globalAlpha=1;
 ctx.restore();
 if(flash>.02){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,VW,VH)}
}
reset();
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min((n-last)/1000,.1);last=n;while(acc>=1/60){step(1/60);acc-=1/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script></body></html>
